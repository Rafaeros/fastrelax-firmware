[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; PubSubClient só entra no binário com MQTT_ENABLED = 1 em config.h — sem isso
; o módulo mqtt não inclui o cabeçalho e o linker descarta a biblioteca. Fica
; declarada aqui para que ligar o transporte seja uma linha, não uma caçada
; por dependência.
lib_deps =
    knolleary/PubSubClient@^2.8

; O firmware é dividido por feature em src/ (relay, session, network, mqtt,
; backend, api, util). Incluir a raiz de src no caminho de busca permite que
; qualquer módulo escreva #include "network/network_manager.h" em vez de contar
; quantos ".." faltam até lá.
build_flags =
    -I src

; Fora o cliente MQTT, nenhuma dependência externa: WiFi, WebServer e
; HTTPClient vêm do framework Arduino do ESP32, e o JSON trocado com o backend
; é parseado no próprio firmware.

extra_scripts = post:copy_bin.py